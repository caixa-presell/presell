<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Seguro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="config.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090a0f;
      background-image:
        radial-gradient(at 50% 0%, rgba(30, 41, 59, 0.45) 0px, transparent 65%),
        radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.4) 0px, transparent 50%);
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #11131a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow:
        0 20px 40px -15px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.02);
      text-align: center;
      position: relative;
    }

    .status-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f8fafc;
      line-height: 1.35;
      margin-bottom: 12px;
    }

    p.desc {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
      padding: 0 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #f8fafc;
      color: #090a0f;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      padding: 16px 22px;
      border-radius: 12px;
      transition: all 0.18s ease;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.1);
    }

    .btn:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.18);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      transition: transform 0.18s ease;
    }

    .btn:hover svg {
      transform: translateX(3px);
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      margin: 24px 0 18px;
    }

    .features {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 12px;
      color: #64748b;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .feature-item svg {
      width: 13px;
      height: 13px;
      color: #10b981;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #475569;
      text-align: center;
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 20px;
      }

      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="card">


    <h1 id="title">Clique abaixo para continuar</h1>

    <a id="link" href="#" class="btn">
      <span>Continuar</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
        stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>

    <div class="divider"></div>

    <div class="features">
      <div class="feature-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Link Seguro</span>
      </div>
      <div class="feature-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Acesso Imediato</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const linkEl = document.getElementById('link');
      const target = (typeof CONFIG !== 'undefined' && CONFIG.url) ? CONFIG.url : '#';

      let finalUrl = target;
      try {
        if (window.location.search && target !== '#') {
          const u = new URL(target, window.location.href);
          const currentParams = new URLSearchParams(window.location.search);
          currentParams.forEach((v, k) => u.searchParams.set(k, v));
          finalUrl = u.toString();
        }
      } catch (e) {
        finalUrl = target;
      }

      linkEl.href = finalUrl;
    })();
  </script>
</body>

</html>
